<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form Pendaftaran Event</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <a href="#" class="back-link">← Kembali</a>

        <h1>Pendaftaran Event</h1>

        <form action="#" method="post">

            <!-- Nama -->
            <div class="form-group">
                <label for="nama">Nama *</label>
                <input
                    type="text"
                    id="nama"
                    name="nama"
                    placeholder="Nama lengkap"
                    required
                >
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email *</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="nama@email.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="hp">Nomor HP</label>
                <input
                    type="tel"
                    id="hp"
                    name="hp"
                    placeholder="08xxxxxxxxxx"
                >
            </div>

            <div class="form-group">
                <label for="tanggal">Tanggal Lahir</label>
                <input
                    type="date"
                    id="tanggal"
                    name="tanggal"
                >
            </div>

            <fieldset class="form-section">
                <legend>Sesi</legend>

                <div class="option">
                    <input
                        type="radio"
                        id="pagi"
                        name="sesi"
                        value="Pagi"
                        checked
                    >
                    <label for="pagi">Pagi</label>
                </div>

                <div class="option">
                    <input
                        type="radio"
                        id="siang"
                        name="sesi"
                        value="Siang"
                    >
                    <label for="siang">Siang</label>
                </div>
            </fieldset>

            <fieldset class="form-section workshop">
                <legend>Minat Workshop</legend>

                <div class="option">
                    <input
                        type="checkbox"
                        id="web"
                        name="workshop[]"
                        value="Web Development"
                    >
                    <label for="web">Web Development</label>
                </div>

                <div class="option">
                    <input
                        type="checkbox"
                        id="uiux"
                        name="workshop[]"
                        value="UI/UX"
                    >
                    <label for="uiux">UI/UX</label>
                </div>

                <div class="option">
                    <input
                        type="checkbox"
                        id="data"
                        name="workshop[]"
                        value="Data Science"
                    >
                    <label for="data">Data Science</label>
                </div>
            </fieldset>

            <button type="submit" class="btn-daftar">
                Daftar
            </button>

        </form>

    </div>

</body>
</html>
